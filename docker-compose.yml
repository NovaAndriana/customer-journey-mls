services:
  postgres:
    image: postgres:16-alpine
    container_name: cjms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cjms_user
      POSTGRES_PASSWORD: cjms_password
      POSTGRES_DB: cjms_db
    ports:
      - "5433:5432"
    volumes:
      - cjms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cjms_user -d cjms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cjms_pgdata: